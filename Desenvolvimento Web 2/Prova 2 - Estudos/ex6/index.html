<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculadora">
        <!-- Visor -->
        <div class="visor">
            <span id="quantidadPreview">0</span>
        </div>

        <!-- Linha de Memória -->
        <div class="linha-memoria">
            <button class="btn-memoria desativado">MC</button>
            <button class="btn-memoria desativado">MR</button>
            <button class="btn-memoria">M+</button>
            <button class="btn-memoria">M-</button>
            <button class="btn-memoria">MS</button>
            <button class="btn-memoria desativado">M&#x2218;</button>
        </div>

        <!-- Grade de Botões -->
        <div class="teclado">
            <!-- Linha 1 -->
            <button class="btn-acao" id="porcentagem">%</button>
            <button class="btn-acao" id="ce">CE</button>
            <button class="btn-acao" id="c">C</button>
            <button class="btn-acao" id="backspace">&#x232B;</button>

            <!-- Linha 2 -->
            <button class="btn-acao" id="inverso">1/x</button>
            <button class="btn-acao" id="quadrado">x²</button>
            <button class="btn-acao" id="raiz">&sup2;&radic;x</button>
            <button class="btn-operador" data-op="/">÷</button>

            <!-- Linha 3 -->
            <button class="btn-num" data-valor="7">7</button>
            <button class="btn-num" data-valor="8">8</button>
            <button class="btn-num" data-valor="9">9</button>
            <button class="btn-operador" data-op="*">×</button>

            <!-- Linha 4 -->
            <button class="btn-num" data-valor="4">4</button>
            <button class="btn-num" data-valor="5">5</button>
            <button class="btn-num" data-valor="6">6</button>
            <button class="btn-operador" data-op="-">−</button>

            <!-- Linha 5 -->
            <button class="btn-num" data-valor="1">1</button>
            <button class="btn-num" data-valor="2">2</button>
            <button class="btn-num" data-valor="3">3</button>
            <button class="btn-operador" data-op="+">+</button>

            <!-- Linha 6 -->
            <button class="btn-acao" id="mais-menos">+/−</button>
            <button class="btn-num" data-valor="0">0</button>
            <button class="btn-num" id="ponto" data-valor=",">,</button>
            <button class="btn-igual" id="igual">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
